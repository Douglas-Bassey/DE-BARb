<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>De-Legend Salon & SPA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="stylesheet.css">
<link rel="shortcut icon" href="images/PNG.png" type="image/x-icon">

</head>

<body>

<div id="preloader">

    <div class="loader-wrapper">

        <div class="logo-wrapper">

            <img
            src="images/PNG.png"
            class="loader-logo"
            alt="logo">

        </div>

        <h6 id="loadingText">

        Moments Deserve Attention.

        </h6>

        <div class="progress-track">

            <div
            class="progress-fill"
            id="progressFill">

            </div>

        </div>

        <div class="loading-bottom">

            <span class="loader-dot">

                <i class="bi bi-scissors"></i>

            </span>

        </div>

    </div>

</div>

<section id="hero">

    <h1 data-aos="fade-up">

        DE LEGEND SALON

    </h1>

</section>



<!-- =========================================
CINEMATIC INTRO
========================================= -->

<section id="cinematicIntro">

    <!-- Spotlight -->

    <div class="spotlight"></div>

    <!-- Dust Particles -->

    <div class="particles"></div>

    <!-- Chair -->

    <div class="chair-wrapper">

        <img
            src="images/salon chair.png"
            alt="Barber Chair"
            class="chair">

    </div>

    <!-- Tools -->

    <div class="tool tool-clippers">

        <img
            src="images/clipper.png"
            alt="Clippers">

    </div>

</section>








<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script src="script.js"> </script>

</body>

</html>
